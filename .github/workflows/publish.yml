name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pending:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          before=$(git show "$BEFORE:package.json" 2> /dev/null | jq -r '.version // empty')
          after=$(jq -r .version package.json)
          publish=false
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            publish=true
          fi

          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"
          echo "version=$after" | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: pending
    if: needs.pending.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tegami-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run tegami publish

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi

          bun packages/cli/src/release/notes.ts "${tag#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"

  image:
    name: Hub Image
    needs: [pending, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ryuudotgg/skills-hub
      VERSION: ${{ needs.pending.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.pending.outputs.version }}
          persist-credentials: false

      - name: Revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log In to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Promote Latest
        run: |
          newest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" != "$VERSION" ]; then
            echo "v$newest is newer, so latest stays where it is"
            exit 0
          fi

          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
